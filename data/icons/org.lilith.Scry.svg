<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1d2b"/>
      <stop offset="100%" stop-color="#121118"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="50%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#5a189a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base App Card -->
  <rect x="14" y="14" width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#38354a" stroke-width="2" filter="url(#shadow)"/>

  <!-- Top Window Header Dots -->
  <circle cx="30" cy="30" r="4" fill="#ff5f56"/>
  <circle cx="42" cy="30" r="4" fill="#ffbd2e"/>
  <circle cx="54" cy="30" r="4" fill="#27c93f"/>

  <!-- Terminal Prompt Symbol -->
  <path d="M30 52 L46 64 L30 76" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="52" y1="76" x2="68" y2="76" stroke="#9d4edd" stroke-width="5" stroke-linecap="round"/>

  <!-- Network / Globe Indicator in bottom corner -->
  <circle cx="86" cy="84" r="16" fill="#242233" stroke="url(#accentGrad)" stroke-width="2.5"/>
  <ellipse cx="86" cy="84" rx="7" ry="16" fill="none" stroke="#c77dff" stroke-width="1.8"/>
  <line x1="70" y1="84" x2="102" y2="84" stroke="#c77dff" stroke-width="1.8"/>
  <line x1="74" y1="74" x2="98" y2="74" stroke="#c77dff" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="74" y1="94" x2="98" y2="94" stroke="#c77dff" stroke-width="1.2" stroke-dasharray="2,2"/>
</svg>
