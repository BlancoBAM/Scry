[package]
name = "scry"
version = "0.1.0"
edition = "2021"
description = "Scry — Fast, secure, persistent web terminal GUI for LAN and Tailscale Funnel access"

[dependencies]
relm4 = { version = "0.9", features = ["libadwaita"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
gtk4 = { version = "0.9", features = ["v4_14"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
